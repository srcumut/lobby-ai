worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Custom log format that sanitizes WebSocket token query parameters.
    # Replaces token=... with token=REDACTED in logged URIs.
    map $request_uri $sanitized_uri {
        ~^(?<path>[^?]*)\?(?<pre>.*)token=[^&]*(?<post>.*)$ "$path?${pre}token=REDACTED${post}";
        default $request_uri;
    }

    log_format sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $sanitized_uri $server_protocol" '
                         '$status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log sanitized;
    error_log /var/log/nginx/error.log;

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # REST API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
        }
    }

    # HTTPS server block — uncomment and configure after obtaining certificates
    # server {
    #     listen 443 ssl;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # ... same location blocks as above ...
    # }
}
