services:
  postgres:
    image: postgres:16-alpine
    container_name: lobby-ai-postgres
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby_dev_password
      POSTGRES_DB: lobby_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lobby -d lobby_ai" ]
      interval: 5s
      timeout: 5s
      retries: 5

  dbgate:
    image: dbgate/dbgate
    container_name: lobby-ai-dbgate
    ports:
      - "3001:3000"
    environment:
      CONNECTIONS: L
      LABEL_L: LobbyAI Database
      SERVER_L: postgres
      USER_L: lobby
      PASSWORD_L: lobby_dev_password
      PORT_L: 5432
      DATABASE_L: lobby_ai
      ENGINE_L: postgres@dbgate-plugin-postgres
    volumes:
      - dbgate_data:/root/.dbgate
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
  dbgate_data:

