services:
  postgres:
    image: postgres:16-alpine
    container_name: lobby-ai-postgres
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: lobby_dev_password
      POSTGRES_DB: lobby_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
