services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lobby-ai-backend
    environment:
      DATABASE_URL: postgres://lobby:${POSTGRES_PASSWORD}@postgres:5432/lobby_ai
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lobby-network

  postgres:
    image: postgres:16-alpine
    container_name: lobby-ai-postgres-prod
    environment:
      POSTGRES_USER: lobby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lobby_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lobby -d lobby_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lobby-network

  nginx:
    image: nginx:1.27-alpine
    container_name: lobby-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - lobby-network

volumes:
  postgres_data:

networks:
  lobby-network:
    driver: bridge
